<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Background Network Lines & Moving Particles -->
  <g stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" fill="none">
    <path d="M 100,150 Q 300,50 600,150 T 1100,150" />
    <path d="M 100,150 Q 300,250 600,150 T 1100,150" />
    <path d="M 100,80 L 1100,80" stroke-dasharray="6,6" opacity="0.4"/>
    <path d="M 100,220 L 1100,220" stroke-dasharray="6,6" opacity="0.4"/>
  </g>

  <!-- Dynamic Animated Pulses / Flow Particles (Background layer) -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="200" cy="115" r="4">
      <animate attributeName="cx" values="100;1100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="185" r="4">
      <animate attributeName="cx" values="100;1100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="150" r="5" fill="#818cf8">
      <animate attributeName="cx" values="100;1100" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Network Nodes (Background Layer) -->
  <g opacity="0.3">
    <circle cx="150" cy="80" r="6" fill="#38bdf8"/>
    <circle cx="1050" cy="80" r="6" fill="#38bdf8"/>
    <circle cx="150" cy="220" r="6" fill="#38bdf8"/>
    <circle cx="1050" cy="220" r="6" fill="#38bdf8"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="1">
      Awesome Application Delivery &amp; Load Balancing ⚡
    </text>
    
    <!-- Subtitle Badge / Pill -->
    <rect x="250" y="165" width="700" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="url(#accent-grad)" stroke-width="2"/>
    <text x="600" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="17" fill="#f8fafc" letter-spacing="0.5">
      Layer 4/7 Load Balancers • Reverse Proxies • Service Discovery • Cloud ADC
    </text>

    <!-- Category Pills -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      <text x="400" y="240">🌐 High Availability</text>
      <text x="530" y="240">🔒 TLS Termination</text>
      <text x="670" y="240">🚀 Cloud-Native &amp; eBPF</text>
      <text x="810" y="240">⚡ Zero-Trust Ingress</text>
    </g>
  </g>
</svg>
